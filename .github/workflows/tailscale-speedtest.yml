name: tailscale-speedtest

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  iperf-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: tskey-auth-k4CGJvcvC311CNTRL-yJGMdszkPbZCd4gN5ifjaZsMvxJSu5QYG

      - name: Install and start iperf3 server
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq iperf3
          nohup iperf3 -s -p 5201 >/tmp/iperf3-server.log 2>&1 &
          sleep 1
          cat /tmp/iperf3-server.log

      - name: Keep alive and report endpoint
        run: |
          echo "runner-tailscale-ip=$(tailscale ip -4 | head -1)"
          sleep 540