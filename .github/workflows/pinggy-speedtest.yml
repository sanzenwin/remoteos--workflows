name: pinggy-speedtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  iperf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start iperf3
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq iperf3
          nohup iperf3 -s -p 5201 >/tmp/iperf3.log 2>&1 &
          sleep 2
          cat /tmp/iperf3.log
          ss -tlnp | grep 5201 || true

      - name: Open Pinggy TCP tunnel in background
        run: |
          setsid ssh -p 443 -R0:127.0.0.1:5201 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -n \
            QHpDcOr7zge+tcp@free.pinggy.io </dev/null >/tmp/pinggy.log 2>&1 &
          sleep 18
          cat /tmp/pinggy.log

      - name: Publish raw log to repo
        run: |
          cd "$GITHUB_WORKSPACE"
          cp /tmp/pinggy.log .github/pinggy-raw.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pinggy-raw.log
          git commit -m "test: pinggy iperf3 single-stream measurement"
          git push
          cat /tmp/pinggy.log

      - name: Keep tunnel alive
        run: sleep 1500