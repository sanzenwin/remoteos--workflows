name: pinggy-speedtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  multi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare payload and server
        run: |
          set -e
          head -c 67108864 /dev/urandom > /tmp/payload.bin
          cd /tmp
          nohup python3 -m http.server 8080 --bind 0.0.0.0 >/tmp/http.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "selfcheck=%{http_code}\n" http://127.0.0.1:8080/payload.bin --max-time 30

      - name: Start cloudflared quick tunnel
        run: |
          set -e
          curl -fsSL --max-time 120 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate >/tmp/cf.log 2>&1 &
          sleep 20
          cat /tmp/cf.log

      - name: Start Pinggy HTTP tunnel
        run: |
          setsid ssh -p 443 -R0:127.0.0.1:8080 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -n \
            QHpDcOr7zge@free.pinggy.io </dev/null >/tmp/pinggy.log 2>&1 &
          sleep 18
          cat /tmp/pinggy.log

      - name: Publish endpoints
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== CLOUDFLARED ==="
            cat /tmp/cf.log
            echo "=== PINGGY ==="
            cat /tmp/pinggy.log
          } > .github/pinggy-raw.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pinggy-raw.log
          git commit -m "test: cloudflared+pinggy combined"
          git push
          cat .github/pinggy-raw.log

      - name: Keep tunnels alive
        run: sleep 1800