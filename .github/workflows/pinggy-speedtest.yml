name: pinggy-speedtest

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  iperf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and start iperf3 server
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq iperf3
          nohup iperf3 -s -p 5201 >/tmp/iperf3.log 2>&1 &
          sleep 1
          cat /tmp/iperf3.log

      - name: Open Pinggy tunnel in background
        run: |
          setsid ssh -p 443 -R0:127.0.0.1:5201 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ExitOnForwardFailure=yes \
            -n \
            QHpDcOr7zge@free.pinggy.io </dev/null >/tmp/pinggy.log 2>&1 &
          sleep 15
          cat /tmp/pinggy.log

      - name: Wait for client
        run: sleep 150