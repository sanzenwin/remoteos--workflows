name: scp-parallel-test

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dropbear, gen 8x16MB shards, start sshd
        run: |
          set -e
          curl -fsSL --max-time 120 https://github.com/sagemathinc/dropbear/releases/download/main/dropbear-x86_64-linux-musl.tar.xz | tar -xJf - -C /tmp
          sudo mkdir -p /root/.ssh
          echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/z8LFseHBX7pwTM6Z+0zLPr1AsrzlJ6AKcFATAeNZn scptest' | sudo tee /root/.ssh/authorized_keys > /dev/null
          sudo mv /tmp/dropbear-x86_64-linux-musl/dropbear /usr/local/bin/dropbear
          sudo mv /tmp/dropbear-x86_64-linux-musl/dropbearkey /usr/local/bin/dropbearkey
          sudo chmod +x /usr/local/bin/dropbear /usr/local/bin/dropbearkey
          sudo mkdir -p /etc/dropbear
          sudo /usr/local/bin/dropbearkey -t ed25519 -f /etc/dropbear/ed25519_host_key 2>&1 | sed 's/.*/****/'
          sudo nohup /usr/local/bin/dropbear -E -p 2222 -r /etc/dropbear/ed25519_host_key > /tmp/dropbear.log 2>&1 &
          sleep 2
          ss -tlnp | grep :2222
          mkdir -p /tmp/shards
          for i in 0 1 2 3 4 5 6 7; do
            head -c 16777216 /dev/urandom > /tmp/shards/shard$i.bin
          done
          ls -l /tmp/shards/

      - name: Start cloudflared tunnel to tcp 2222
        run: |
          set -e
          curl -fsSL --max-time 120 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url tcp://localhost:2222 --no-autoupdate > /tmp/cf.log 2>&1 &
          sleep 20
          HOST=$(grep -oE '[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "$HOST" > /tmp/host.txt

      - name: Publish host
        run: |
          cd "$GITHUB_WORKSPACE"
          cp /tmp/host.txt .github/pinggy-raw.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pinggy-raw.log
          git commit -m "test: scp parallel host"
          git push
          cat .github/pinggy-raw.log

      - name: Keep tunnel alive
        run: sleep 1800