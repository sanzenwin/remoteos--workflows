name: OpenCode Win Cross Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Build driver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL "https://github.com/sanzenwin/remoteos--workflows/releases/download/opencode-src-t1/driver-remote.sh" -o /tmp/driver.sh
          bash /tmp/driver.sh

  installer:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    env:
      REPO: sanzenwin/remoteos--workflows
      TAG: opencode-src-t1
    steps:
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /?

      - name: Fetch opencode.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path work | Out-Null
          curl.exe -fsSL --retry 5 -o work\artifacts.tar.gz "https://github.com/$env:REPO/releases/download/$env:TAG/artifacts.tar.gz"
          tar -xzf work\artifacts.tar.gz -C work
          $exe = Get-Item "work\opencode-windows-x64\bin\opencode.exe"
          "exe bytes: $($exe.Length)"

      - name: Write installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          curl.exe -fsSL --retry 5 -o installer.iss "https://raw.githubusercontent.com/$env:REPO/main/installer.iss"
          (Get-Item installer.iss).Length

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem out

      - name: Upload installer asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "opencode-1.19.3-setup-windows-x64.exe"
          $h = @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $rel = Invoke-RestMethod -Headers $h "https://api.github.com/repos/$env:REPO/releases/tags/$env:TAG"
          $rel.assets | Where-Object name -eq $name | ForEach-Object {
            Invoke-RestMethod -Method Delete -Headers $h "https://api.github.com/repos/$env:REPO/releases/assets/$($_.id)" | Out-Null
          }
          $path = "out\$name"
          curl.exe -fsS -X POST -H "Authorization: token $env:GITHUB_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$path" "https://uploads.github.com/repos/$env:REPO/releases/$($rel.id)/assets?name=$name"
          "uploaded: $name"
