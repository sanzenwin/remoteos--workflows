name: OpenCode Win Cross Build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Build driver
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL "https://github.com/sanzenwin/remoteos--workflows/releases/download/opencode-src-t1/driver-remote.sh" -o /tmp/driver.sh
          bash /tmp/driver.sh
